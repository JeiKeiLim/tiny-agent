# Kestrel-150M pretrain on the expanded 12GiB corpus. Loaded into
# kestrel.train.pretrain.PretrainConfig.
#
# Single-pass by design: total_tokens is null, so the run trains until the
# 12GiB train split is exhausted (no multi-epoch). num_steps <= 0 disables the
# step cap; the LR horizon is derived from the corpus manifest's estimated step
# count.
#
# betas is intentionally unset: TrainerConfig defaults to (0.9, 0.95).
model: configs/kestrel/150m/model.yaml
tokenizer: checkpoints/tokenizer/tokenizer.json
corpus: configs/kestrel/corpus.yaml
total_tokens: null
trainer:
  lr: 0.0003
  weight_decay: 0.1
  batch_size: 4
  seq_len: 1024
  num_steps: 0
  warmup_steps: 500
  grad_clip: 1.0
  save_every: 2000
  log_every: 100
  eval_every: 1000
  eval_iters: 10
  output_dir: checkpoints/pretrain/150m
  keep_latest_checkpoints: 5
  keep_best_checkpoint: true
