# Kestrel-50M pretrain (plan §6, build-order step 1). Loaded into
# kestrel.train.pretrain.PretrainConfig.
#
# Single-pass by design: total_tokens is null, so the run trains until the
# corpus is exhausted (no multi-epoch). num_steps is a safety cap set well above
# the expected single-pass step count (~33.6k for the ~1GB / ~275M-token corpus
# at batch 8 x seq 1024), so the corpus exhausts first.
#
# betas is intentionally unset: TrainerConfig defaults to (0.9, 0.95).
model: configs/kestrel/150m/model.yaml
tokenizer: checkpoints/tokenizer/tokenizer.json
corpus: configs/kestrel/corpus.yaml
total_tokens: null
trainer:
  lr: 0.0003
  weight_decay: 0.1
  batch_size: 4
  seq_len: 1024
  num_steps: 40000
  warmup_steps: 500
  grad_clip: 1.0
  save_every: 2000
  log_every: 100
  eval_every: 1000
  eval_iters: 10
  output_dir: checkpoints/pretrain/150m
