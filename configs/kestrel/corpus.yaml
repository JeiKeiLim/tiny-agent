# Pretraining corpus (plan §8). Loaded into kestrel.corpus.config.CorpusConfig.
#
# Document-level corpus: stream the same HF sources used for tokenizer training
# and write one JSON document per physical line. total_bytes is the raw-text
# budget; the dataset step's total_tokens is the authoritative training cap.
total_bytes: 1073741824  # ~1 GB
seed: 0
output_dir: data/corpus
# jsonl = one physical line is one document; internal newlines stay in `text`.
output_format: jsonl
# Set to checkpoints/tokenizer/tokenizer.json for exact manifest token counts.
tokenizer_path: null
# Deterministic per-document hash split (seeded by `seed`): held-out validation slice
# for in-loop val loss / perplexity, same distribution as train. test_fraction 0 =
# no separate test slice (pretrain "test" is the downstream eval, not a held-out set).
val_fraction: 0.1
test_fraction: 0.0
components:
  - name: web
    fraction: 0.85
    source:
      type: hf
      dataset: HuggingFaceFW/fineweb-edu
      text_field: text
  - name: code
    fraction: 0.10
    source:
      type: hf
      dataset: theothertom/codeparrot-python-only
      text_field: code
  - name: jsonl
    fraction: 0.05
    source:
      type: hf
      dataset: tatsu-lab/alpaca
