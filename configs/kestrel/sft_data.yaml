# M2 SFT source data preparation. Loaded into kestrel.data.sft_prepare.SFTDataConfig.
# This dataset is shared by the 50M and 150M SFT runs.
output_dir: data/sft/raw
tokenizer_path: checkpoints/tokenizer/tokenizer.json
context_length: 1024
seed: 42
assistant:
  dataset_id: HuggingFaceTB/smol-smoltalk
  split: train
  source: assistant_public
  target_rows: 22500
gsm8k:
  dataset_id: openai/gsm8k
  dataset_config: main
  split: train
  source: gsm8k_math
  target_rows: 7500
tool:
  source: tool_local
  min_tools: 3
  max_tools: 5
  train:
    direct: 6000
    no_tool: 1500
    distractor_heavy: 1000
    missing_info: 750
    hard_variation: 750
  eval:
    seen: 500
    unseen: 500
    no_call: 250
    missing_info: 250
