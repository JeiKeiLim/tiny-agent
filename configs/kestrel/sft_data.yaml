# M2 SFT source data preparation. Loaded into kestrel.data.sft_prepare.SFTDataConfig.
# This dataset is shared by the 50M and 150M SFT runs.
output_dir: data/sft/raw
tokenizer_path: checkpoints/tokenizer/tokenizer.json
context_length: 1024
seed: 42
assistant:
  dataset_id: HuggingFaceTB/smol-smoltalk
  split: train
  source: assistant_public
  target_rows: 22500
  max_candidate_rows: 100000
gsm8k:
  dataset_id: openai/gsm8k
  dataset_config: main
  split: train
  source: gsm8k_math
  target_rows: 7500
tool:
  source: tool_local
  min_tools: 3
  max_tools: 5
  train:
    direct: 6000
    no_tool: 1500
    distractor_heavy: 1000
    missing_info: 750
    hard_variation: 750
  eval:
    seen: 500
    unseen: 500
    no_call: 250
    missing_info: 250
public_tool:
  dataset_id: argilla/apigen-function-calling
  split: train
  source: tool_public
  target_rows: 5000
  max_tools: 5
  max_query_chars: 512
  max_tool_chars: 2048
  max_list_items: 10
internal_llm:
  enabled: false
  api_base_env: KESTREL_LLM_API_BASE
  api_key_env: KESTREL_LLM_API_KEY
  model_env: KESTREL_LLM_MODEL
  source: internal_llm
  prompt_version: v1
  assistant_rows: 2000
  math_rows: 2000
  tool_rows: 1000
  max_workers: 8
  progress_every: 10
  debug_drops: false
  debug_drop_limit: 20
eval:
  output_dir: data/sft/eval
  seed: 42
  assistant_split: test
  assistant_target_rows: 200
  gsm8k_split: test
  gsm8k_dataset_config: main
  gsm8k_target_rows: 500
  tool_eval: true
mixture:
  input_dir: data/sft/raw
  output_dir: data/sft/mixture
  output_name: sft-50k.jsonl
  seed: 42
  deficit_policy: allow
  fallback_when_internal_missing: true
  recipe:
    assistant_public: 22500
    gsm8k_math: 7500
    tool_local: 10000
    tool_public: 5000
    internal_llm: 5000
  fallback_recipe:
    assistant_public: 22500
    gsm8k_math: 7500
    tool_local: 12500
    tool_public: 7500
    internal_llm: 0
