# Kestrel-50M pretrain on the expanded 12GiB corpus. Loaded into
# kestrel.train.pretrain.PretrainConfig.
#
# Chinchilla-capped by design: total_tokens is about 20 tokens/param, so the
# 50M model trains on a prefix of the 12GiB corpus rather than the full
# 3.27B estimated train tokens. num_steps <= 0 disables the step cap; the LR
# horizon is derived from the token cap.
#
# betas is intentionally unset: TrainerConfig defaults to (0.9, 0.95).
model: configs/kestrel/50m/model.yaml
tokenizer: checkpoints/tokenizer/tokenizer.json
corpus: configs/kestrel/corpus.yaml
total_tokens: 1013504000
trainer:
  lr: 0.0003
  weight_decay: 0.1
  batch_size: 8
  seq_len: 1024
  num_steps: 0
  warmup_steps: 500
  grad_clip: 1.0
  save_every: 2000
  log_every: 100
  eval_every: 1000
  eval_iters: 10
  output_dir: checkpoints/pretrain/50m
  keep_latest_checkpoints: 5
  keep_best_checkpoint: true
