[project]
name = "kestrel"
version = "0.1.0"
description = "Kestrel: small-scale agentic LLM training pipeline (MLX)."
readme = "README.md"
authors = [
    { name = "Jongkuk Lim", email = "lim.jeikei@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.32.1",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
