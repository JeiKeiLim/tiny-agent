[project]
name = "kestrel"
version = "0.1.0"
description = "Kestrel: small-scale agentic LLM training pipeline (MLX)."
readme = "README.md"
authors = [
    { name = "Jongkuk Lim", email = "lim.jeikei@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "mlx>=0.32.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.1",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mlx.*", "tokenizers.*", "datasets.*", "truststore.*"]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
